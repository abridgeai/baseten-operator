name: Image Startup Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  standard:
    name: Standard image startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        run: |
          mkdir -p image-test-logs
          docker build --progress=plain -t baseten-operator:smoke . 2>&1 | tee image-test-logs/build.log
      - name: Check startup without cluster credentials
        run: timeout 30s docker run --rm --network none baseten-operator:smoke --help 2>&1 | tee image-test-logs/startup.log
      - name: Upload image test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standard-image-test-logs
          path: image-test-logs/
          retention-days: 7
          if-no-files-found: ignore

  fips:
    name: FIPS image startup
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Authenticate for private FIPS base images
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ARTIFACT_REGISTRY }}
          service_account: ${{ vars.GCP_SA_EMAIL_ARTIFACT_REGISTRY }}
          token_format: access_token
          create_credentials_file: false
      - name: Log in to GAR
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf '%s' "$ACCESS_TOKEN" | docker login us-docker.pkg.dev -u oauth2accesstoken --password-stdin
      - name: Build FIPS image with release base images
        run: |
          GOVER=$(awk '$1 == "go" {print $2}' go.mod)
          test -n "$GOVER"
          mkdir -p image-test-logs
          docker build --progress=plain -t baseten-operator:fips-smoke \
            --build-arg "BUILDER_IMAGE=us-docker.pkg.dev/abridge-artifact-registry/cgr/abridge.com/go-fips:${GOVER}-dev" \
            --build-arg RUNTIME_IMAGE=us-docker.pkg.dev/abridge-artifact-registry/cgr/abridge.com/glibc-openssl-fips:latest \
            --build-arg CGO_ENABLED=1 . 2>&1 | tee image-test-logs/build.log
      - name: Check FIPS initialization without cluster credentials
        run: timeout 30s docker run --rm --network none baseten-operator:fips-smoke --help 2>&1 | tee image-test-logs/startup.log
      - name: Upload FIPS image test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fips-image-test-logs
          path: image-test-logs/
          retention-days: 7
          if-no-files-found: ignore
